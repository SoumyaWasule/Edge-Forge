# CI — run smoke tests on every push / PR
name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install "openenv-core[core]>=0.2.2" "openai>=1.0.0" "pytest>=8.0.0"

      - name: Run tests
        run: pytest tests/ -v
