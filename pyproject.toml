[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-edge_forge_env"
version = "0.1.0"
description = "Edge Forge Env environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    # Core OpenEnv runtime (provides FastAPI server + HTTP client types)
    # install from github
    # "openenv-core[core] @ git+https://github.com/meta-pytorch/OpenEnv.git",
    "openenv-core[core]>=0.2.2",
    # Environment-specific dependencies
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m edge_forge_env.server.app
server = "edge_forge_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["edge_forge_env", "edge_forge_env.server"]
package-dir = { "edge_forge_env" = ".", "edge_forge_env.server" = "server" }